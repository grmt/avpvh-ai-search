name: "CI"
on:
  # Branches are tested through their pull request (the merge result);
  # main once more after each merge.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI and zips its build.
  workflow_call:

permissions:
  contents: read

env:
  node-version: 24.16.0
  npm-version: 11.13.0

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # git archive honours export-ignore in .gitattributes, so this holds
      # exactly what the release ZIP holds: no docs, scripts, tests or CI files.
      - name: "Package what a release ships"
        run: |
          mkdir build
          git archive HEAD | tar -x -C build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: build

  # Shared with the other own plugins: declared PHP floor, syntax on 8.4 and
  # 8.5, PHPCompatibility, naming style and the WordPress.org Plugin Check on
  # the build.
  plugin-checks:
    name: "Shared"
    needs: build
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-ai-search
      artifact: build-artifact
      # No prefix check yet: options, tables and the namespace keep their
      # geweb names until a migration to avpvh_srch_ (see readme 3.0.0).
      # PHPStan off until the existing findings are worked through.
      phpstan-level: ""
      # outdated_tested_upto_header: not on WordPress.org; it updates from
      # GitHub Releases (Update URI), so plugin_updater_detected is expected.
      # Everything after plugin_updater_detected is the baseline of existing
      # findings (2026-11-16); remove each line in the PR that fixes it.
      ignore-codes: |
        outdated_tested_upto_header
        PluginCheck.CodeAnalysis.Offloading.OffloadedContent
        plugin_updater_detected
        WordPress.WP.AlternativeFunctions.curl_curl_init
        WordPress.WP.AlternativeFunctions.curl_curl_setopt_array
        WordPress.WP.AlternativeFunctions.curl_curl_exec
        WordPress.WP.AlternativeFunctions.curl_curl_getinfo
        WordPress.WP.AlternativeFunctions.curl_curl_error
        WordPress.WP.AlternativeFunctions.curl_curl_close
        WordPress.DB.PreparedSQL.NotPrepared
        WordPress.Security.EscapeOutput.ExceptionNotEscaped
        PluginCheck.Security.DirectDB.UnescapedDBParameter
        WordPress.WP.I18n.MissingTranslatorsComment
        WordPress.WP.AlternativeFunctions.strip_tags_strip_tags
        WordPress.WP.AlternativeFunctions.unlink_unlink
        WordPress.WP.AlternativeFunctions.rename_rename
        WordPress.DateTime.RestrictedFunctions.date_date

  # Shared tests, coverage (Codecov OIDC) and SonarQube Cloud analysis.
  quality:
    name: "Quality"
    uses: grmt/wp-plugin-ci/.github/workflows/quality.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      sonar-exclusions: "libs/**,languages/**,scripts/**"

  # This plugin's own checks.
  lint-js:
    name: "ESLint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - name: "Pin npm version"
        run: npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: npm ci

      - name: "Lint JavaScript"
        run: npm run lint
